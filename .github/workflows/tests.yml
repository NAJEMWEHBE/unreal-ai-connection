name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for GITHUB_TOKEN: every job only reads the repo.
permissions:
  contents: read

# Cancel in-flight runs when a new commit is pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The main-branch ruleset lists "detect changes" as a required check. This
  # job used to gate pytest off for docs-only PRs; it now gates nothing and
  # only reports success so PRs stay mergeable. Drop it once the ruleset no
  # longer requires the check (a repo-settings change for the maintainer).
  detect-changes:
    name: detect changes
    runs-on: ubuntu-latest
    steps:
      - run: echo "pytest runs on every PR; nothing to detect."

  ruff:
    name: ruff check + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Same pin as the dev extra in pyproject.toml: ruff changes its default rules between minor versions.
      - run: pip install "ruff>=0.17,<0.18"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  # Runs on every PR, docs-only ones included: the doc guards (test_drift_sweep,
  # test_skill_tool_refs, test_no_personal_leaks, test_catalog_sync) live in
  # pytest and exist precisely to check Markdown changes. The suite takes
  # seconds, so there is nothing to save by skipping it.
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run unit tests with coverage
        run: pytest tests/ -v --cov=bridge --cov-report=term-missing

  # The PyPI / MCP Registry route needs a wheel that actually builds and runs.
  package:
    name: build wheel + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build --wheel --outdir dist/
      - name: Install the wheel and answer an MCP initialize over stdio
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            | /tmp/wheel-env/bin/unreal-ai-connection | grep -q '"serverInfo"'
