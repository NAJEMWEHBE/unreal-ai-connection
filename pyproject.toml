[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# Same name as server.json's PyPI `identifier`, so `uvx unreal-ai-connection`
# (what the MCP Registry runs) installs this package and its console script.
name = "unreal-ai-connection"
# Read from SERVER_VERSION in the bridge, so the wheel, server.json and the
# .uplugin share one version (tests/test_packaging.py checks the rest).
dynamic = ["version"]
description = "Python bridge for the Unreal AI Connection Unreal Engine 5.7 plugin. Translates any MCP client's stdio MCP transport to the plugin's raw JSON-RPC over a local TCP socket."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "HD Media" },
]
keywords = [
    "unreal-engine",
    "ue5",
    "ue5.7",
    "mcp",
    "model-context-protocol",
    "claude",
    "claude-code",
    "editor-automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/NAJEMWEHBE/unreal-ai-connection"
Repository = "https://github.com/NAJEMWEHBE/unreal-ai-connection"
Issues = "https://github.com/NAJEMWEHBE/unreal-ai-connection/issues"

[project.scripts]
unreal-ai-connection = "unreal_ai_connection_bridge:main"

[tool.hatch.version]
path = "bridge/unreal_ai_connection_bridge.py"
pattern = '^SERVER_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
# The bridge is one stdlib-only module; ship only that, at the top level.
only-include = ["bridge/unreal_ai_connection_bridge.py"]
sources = ["bridge"]

[tool.hatch.build.targets.sdist]
only-include = ["bridge/unreal_ai_connection_bridge.py", "README.md", "LICENSE", "pyproject.toml"]

# The bridge has no runtime dependencies beyond the Python stdlib.
# Dev dependencies (pytest, ruff) are below under [project.optional-dependencies].

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.17,<0.18",
]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    # Generated / vendored
    ".git",
    ".github",
    "build",
    "dist",
    # UE-side artifacts (not Python)
    "UnrealAIConnection/Binaries",
    "UnrealAIConnection/Intermediate",
    "UnrealAIConnection/Saved",
]

[tool.ruff.lint]
# Conservative rule set — the bridge is small stdlib-only code; we don't
# need aggressive lints. This catches real bugs (F, B), enforces import
# order (I), keeps style consistent (E, W), and modernizes idioms (UP).
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (real bugs: unused imports, undefined names)
    "I",   # isort (import order)
    "B",   # flake8-bugbear (likely bugs and design problems)
    "UP",  # pyupgrade (use newer syntax where available)
]
# E501 (line too long) is delegated to the formatter — it will wrap or warn
# but doesn't fail the lint.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# One-off in-editor scene scripts keep their %-formatting; the bridge and tests do not.
"scripts/**" = ["UP031"]

[tool.ruff.lint.isort]
known-first-party = ["unreal_ai_connection_bridge"]

[tool.ruff.format]
# Ruff format is roughly black-compatible.
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
# The bridge module lives outside conventional package layout; conftest.py
# inserts the path at collection time. Don't change this without reading
# tests/conftest.py.
